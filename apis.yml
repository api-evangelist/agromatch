name: AgroMatch
description: >-
  AgroMatch is a Chilean agricultural technology (AgTech) platform, founded in 2018 and backed by 500
  Global, that connects farmers, agricultural contractors, and machinery owners in a single collaborative
  marketplace. Often described as the "Airbnb of agricultural machinery," it lets machinery owners lease
  idle equipment (tractors, implements, portable bins) during low-use periods to farmers in regions whose
  seasons do not coincide, and lets farmers contract or offer agricultural services such as harvesting,
  soil preparation, and crop applications. The platform also supports buying and selling new and used
  machinery, operative leasing, and supplier networking, using artificial intelligence and IoT to match
  demand for machinery with available supply. AgroMatch reports more than 400 B2B customers across Chile
  and Perú with operations extending to the US, Colombia, and Mexico. The company operates as a web and
  mobile application at app.agromatch.cl; no public developer API, OpenAPI specification, or developer
  portal is published as of this enrichment pass.
